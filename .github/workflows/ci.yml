# The contract this repository actually promises:
#   * typecheck, unit tests and the build pass on every supported Node line;
#   * the committed `lib/` matches the source.
#
# The second one matters more than usual here. This package ships its build
# output (DSH STORE requires the runtime artifacts to exist inside the fixed
# Commit), so a source change that was never rebuilt would be installed as the
# old code — silently. `git diff --exit-code -- lib` turns that into a red build.
#
# Not run here: `npm run smoke:local` and `verify:realdata`. They read this
# machine's real `~/.dsh`, which a runner does not have; they are local tools.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.x'
          - os: ubuntu-latest
            node: '24.x'
          - os: windows-latest
            node: '24.x'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` honours the repository's .npmrc (legacy-peer-deps for the
      # @deepseek-ai peer tree) and fails if package.json and the lock disagree.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: The committed build output must match the source
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'
        run: git diff --exit-code -- lib
