# dsh-usage-unified bundle patch: insert this plugin's row into the profile
# roster. One row mounts both halves — the browser half is driven by the
# `dsh.client` declaration in package.json, not by a second row.
#
# Install (published or from a checkout, pick one):
#   dsh plugin --profile web add dsh-usage-unified
#   npx -y @deepseek-ai/dsh plugin --profile web add dsh-usage-unified
- insert:
    - id: usage-unified
      name: dsh-usage-unified
      inject: [webServer]
      config:
        extraSessionRoots: []
        includeCompaction: true
        refreshIntervalMs: 30000
        indexChunkYieldMs: 16
        apiPath: /usage-unified/v1
